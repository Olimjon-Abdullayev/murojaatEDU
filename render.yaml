services:
  - type: web
    name: murojaat-edu
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_ACCESS_CODE
        sync: false
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_TTS_MODEL
        value: gemini-3.8-flash-tts
      - key: AI_DAILY_LIMIT
        value: 50
